# Spore's lines for Hyprland's config (~/.config/hypr/hyprland.conf).

# The shell starts with the session.
exec-once = spore

# Spore's shortcuts (the same as niri's).
bind = SUPER ALT, L, exec, spore-ipc lock lock
bind = SUPER ALT, C, exec, spore-ipc controlcenter toggle
bind = SUPER ALT, comma, exec, spore-ipc settings toggle
bind = SUPER ALT, A, exec, spore-ipc appearance toggle
bind = SUPER ALT, V, exec, spore-ipc clipboard toggle
bind = SUPER ALT, P, exec, spore-ipc power toggle
bind = SUPER ALT, F, exec, spore-files

# Idle turns the monitors off; a key or the mouse turns them back on.
misc {
    key_press_enables_dpms = true
    mouse_move_enables_dpms = true
}

# The window borders in Spore's palette (the folder fills in when the shell
# first runs; install.sh leaves an empty colors.conf there, because Hyprland
# reports a source that matches nothing).
source = ~/.local/state/spore/hypr/*.conf
